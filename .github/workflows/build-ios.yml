name: Build iOS IPA for SideStore

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          
      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
        
      - name: Create missing SplashScreen storyboard
        run: |
          cat > ios/MusicFree/SplashScreen.storyboard << 'STORYBOARD'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="21701" targetRuntime="AppleSDK" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <device id="retina6_12" orientation="portrait" appearance="light"/>
              <dependencies>
                  <deployment identifier="iOS"/>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="21678"/>
                  <capability name="Safe area layout guides" minToolsVersion="9.0"/>
                  <capability name="documents saved in the Xcode 8 format" minToolsVersion="8.0"/>
              </dependencies>
              <scenes>
                  <scene sceneID="EHf-IW-A2E">
                      <objects>
                          <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                              <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                                  <rect key="frame" x="0.0" y="0.0" width="393" height="852"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <color key="backgroundColor" white="1" alpha="1" colorSpace="custom" customColorSpace="genericGamma22GrayColorSpace"/>
                                  <viewLayoutGuide key="safeArea" id="Bcu-3y-fUS"/>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                      </objects>
                      <point key="canvasLocation" x="53" y="375"/>
                  </scene>
              </scenes>
          </document>
          STORYBOARD
          echo "Created SplashScreen.storyboard"
          
      - name: Archive iOS Device (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -workspace MusicFree.xcworkspace \
            -scheme MusicFreeNew \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/MusicFree.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive
            
      - name: Package IPA from archive
        run: |
          APP_PATH="ios/build/MusicFree.xcarchive/Products/Applications/MusicFree.app"
          if [ -d "$APP_PATH" ]; then
            echo "Found app in archive: $APP_PATH"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r "${{ github.workspace }}/MusicFree.ipa" Payload
            rm -rf Payload
          else
            echo "ERROR: App not found in archive"
            find ios/build -name "*.app" -type d 2>/dev/null
            exit 1
          fi
          ls -lh MusicFree.ipa
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MusicFree-iPA
          path: MusicFree.ipa
          retention-days: 30

name: Build iOS IPA for SideStore

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          
      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Remove expo-splash-screen from Podfile
        working-directory: ios
        run: |
          sed -i '' '/expo-splash-screen/d' Podfile
          echo "Removed expo-splash-screen from Podfile"
          cat Podfile
          
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
        
      - name: Archive iOS Device (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -workspace MusicFree.xcworkspace \
            -scheme MusicFreeNew \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/MusicFree.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive
            
      - name: Package IPA from archive
        run: |
          APP_PATH="ios/build/MusicFree.xcarchive/Products/Applications/MusicFree.app"
          if [ -d "$APP_PATH" ]; then
            echo "Found app in archive: $APP_PATH"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r "${{ github.workspace }}/MusicFree.ipa" Payload
            rm -rf Payload
          else
            echo "ERROR: App not found in archive"
            find ios/build -name "*.app" -type d 2>/dev/null
            exit 1
          fi
          ls -lh MusicFree.ipa
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MusicFree-iPA
          path: MusicFree.ipa
          retention-days: 30
